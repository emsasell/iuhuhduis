<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>FriendFind — Найди друзей</title><style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f4f4f5;font-family:Inter,Arial,sans-serif}header{position:sticky;top:0;background:#09090bdd;border-bottom:1px solid #27272a;padding:14px 5%;display:flex;justify-content:space-between;align-items:center;backdrop-filter:blur(12px);z-index:5}.logo{font-weight:800}.wrap{max-width:1100px;margin:auto;padding:28px 16px;display:grid;grid-template-columns:240px 1fr;gap:24px}.card{background:#121215;border:1px solid #27272a;border-radius:18px;padding:18px}.nav button,.btn{width:100%;padding:11px;border:0;border-radius:12px;background:transparent;color:#d4d4d8;text-align:left;cursor:pointer}.nav button:hover,.btn:hover{background:#27272a}.search,input,textarea,select{width:100%;background:#18181b;border:1px solid #27272a;border-radius:12px;color:white;padding:12px}.profiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px}.profile{background:#121215;border:1px solid #27272a;border-radius:16px;padding:16px}.avatar{width:46px;height:46px;border-radius:50%;background:#27272a;display:grid;place-items:center;font-weight:bold}.badge{color:#fff;font-size:14px}.muted{color:#a1a1aa;font-size:13px}.primary{background:white;color:#09090b;text-align:center;font-weight:700}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:16px}.modal.open{display:grid}.modal .card{width:min(420px,100%)}a{color:#fff}.bottom{display:none}@media(max-width:700px){.wrap{display:block;padding-bottom:80px}.side{display:none}.profiles{grid-template-columns:1fr}.bottom{display:flex;position:fixed;bottom:12px;left:4%;right:4%;justify-content:space-around;background:#18181be8;border:1px solid #333;border-radius:18px;padding:8px;z-index:4}.bottom button{background:none;border:0;color:white;padding:8px}.hero{font-size:22px!important}}

@keyframes float{50%{transform:translateY(-6px)}}@keyframes pop{0%{opacity:0;transform:translateY(18px) scale(.97)}100%{opacity:1;transform:none}}@keyframes glow{50%{box-shadow:0 0 28px #fff3}}body{background:radial-gradient(circle at top,#1d1d29 0,#09090b 42%)}.hero-img{height:170px;border-radius:15px;background:linear-gradient(90deg,#0008,#0002),url('https://images.unsplash.com/photo-1529156069898-49953e39b3ac?auto=format&fit=crop&w=1200&q=80') center/cover;display:flex;align-items:end;padding:20px;margin-bottom:16px;animation:glow 4s infinite}.profile{transition:.25s;animation:pop .45s ease both}.profile:hover{transform:translateY(-5px);border-color:#666}.avatar{overflow:hidden;animation:float 4s ease-in-out infinite}.nav button{transition:.2s}.nav button:hover{transform:translateX(5px)}.primary{transition:.2s}.primary:hover{transform:scale(1.02)}.interest-img{height:64px;border-radius:12px;margin:8px 0;background-size:cover;background-position:center}.modal.open .card{animation:pop .25s ease both}
</style></head><body>
<header><div class="logo">✦ FriendFind</div><div><button class="btn" style="width:auto" onclick="openAuth()">Войти</button></div></header>
<div class="wrap"><aside class="side"><div class="card nav"><b class="muted">НАВИГАЦИЯ</b><button onclick="showHome()">⌂ Лента</button><button onclick="openCreate()">＋ Найти друга</button><button onclick="openProfile()">◯ Профиль</button></div><div class="card" style="margin-top:14px"><b class="muted">ИНТЕРЕСЫ</b><div class="interest-img" style="background-image:url(https://images.unsplash.com/photo-1542751371-adc38448a05e?auto=format&fit=crop&w=500&q=80)"></div><button class="btn">🎮 Игры</button><div class="interest-img" style="background-image:url(https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=500&q=80)"></div><button class="btn">🎵 Музыка</button><button class="btn">🎨 Творчество</button><button class="btn">💬 Общение</button></div></aside>
<main><div class="card"><div class="hero-img"><div><div class="hero" style="font-size:26px;font-weight:800">Найди друзей, с которыми совпадают интересы</div><p class="muted">FriendFind помогает знакомиться, общаться и находить компанию.</p></div></div><div style="margin-top:14px"><input class="search" placeholder="Поиск людей по интересам..." oninput="filterCards(this.value)"></div></div>
<div id="profiles" class="profiles"></div>
<div class="card" style="margin-top:18px"><b>FriendFind в MAX</b><p class="muted">Новости и обновления проекта.</p><a href="https://max.ru/join/b16CXfNfIYoMnUCOf_mKoOSd9j_RVaCCEP0yiZNAFdM" target="_blank">Открыть канал MAX ↗</a><br><br><a href="https://max.ru/u/f9LHodD0cOLZ001CojeBRCI7x8oZJnhyDEEh5DkSxknHR12rb4PuJjLO23Y" target="_blank">Поддержка MAX ↗</a></div></main></div>
<div class="bottom"><button onclick="showHome()">⌂</button><button onclick="openCreate()">＋</button><button onclick="openProfile()">◯</button></div>
<div id="modal" class="modal"><div class="card"><button class="btn" style="float:right;width:auto" onclick="closeModal()">×</button><div id="modalContent"></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="/config.js"></script><script>
let sb=null; let me=null;
async function initSupabase(){
  try{const r=await fetch('/api/config',{cache:'no-store'}); if(r.ok){const c=await r.json(); if(c.SUPABASE_URL?.startsWith('http')&&c.SUPABASE_ANON_KEY) sb=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);}}catch(e){}
  if(!sb){const c=window.FF_CONFIG||{}; if(c.SUPABASE_URL?.startsWith('http')&&c.SUPABASE_ANON_KEY) sb=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);}
}
const profiles=document.getElementById('profiles'), modal=document.getElementById('modal'), modalContent=document.getElementById('modalContent');
const esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function openModal(s){modalContent.innerHTML=s;modal.classList.add('open')} function closeModal(){modal.classList.remove('open')}
async function refresh(){if(!sb){profiles.innerHTML='<div class="card muted">Supabase пока не настроен. Добавьте NEXT_PUBLIC_SUPABASE_URL и NEXT_PUBLIC_SUPABASE_ANON_KEY в Vercel и сделайте Redeploy.</div>';return} const {data}=await sb.auth.getUser(); me=data.user||null; await loadProfiles();}
async function loadProfiles(){let q=sb.from('profiles').select('id,username,display_name,bio,interests,city,avatar_url,verified,role,banned').eq('banned',false).limit(60);let {data,error}=await q;if(error){profiles.innerHTML='<div class=card>Ошибка: '+esc(error.message)+'</div>';return} render(data||[])}
function render(items){profiles.innerHTML=items.map(x=>`<div class=profile><div style="display:flex;gap:10px;align-items:center"><div class=avatar>${x.avatar_url?`<img src="${esc(x.avatar_url)}" style="width:100%;height:100%;object-fit:cover;border-radius:50%">`:esc((x.display_name||x.username||'?')[0].toUpperCase())}</div><div><b>${esc(x.display_name||x.username)} ${x.verified?'<span class=badge>✓</span>':''} ${x.role==='owner'?'👑':''}</b><div class=muted>${esc((x.interests||[]).join(' • '))}${x.city?' · '+esc(x.city):''}</div></div></div><p class=muted>${esc(x.bio)}</p><button class="btn primary" onclick="sendRequest('${x.id}')">Добавить</button></div>`).join('')||'<div class="card muted">Пока нет анкет.</div>'}
async function filterCards(q){if(!sb)return; q=q.trim();let query=sb.from('profiles').select('*').eq('banned',false);if(q)query=query.or(`username.ilike.%${q}%,display_name.ilike.%${q}%,bio.ilike.%${q}%`);let {data}=await query.limit(60);render(data||[])}
function openAuth(){openModal(`<h2>Вход / регистрация</h2><p class=muted>После регистрации Supabase отправит письмо для подтверждения email.</p><input id=username placeholder="Никнейм (для регистрации)"><input id=email placeholder="Почта" style="margin-top:8px"><input id=pass type=password placeholder="Пароль" style="margin-top:8px"><button class="btn primary" style="margin-top:10px" onclick="register()">Зарегистрироваться</button><button class=btn onclick="login()">Войти</button><p id=authmsg class=muted></p>`)}
async function register(){if(!sb){const m=document.getElementById('authmsg'); if(m)m.textContent='Supabase пока не настроен в переменных Vercel.'; return} const email=document.getElementById('email').value, password=document.getElementById('pass').value, username=document.getElementById('username').value; const {error}=await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin, data:{username}}});document.getElementById('authmsg').textContent=error?error.message:'Готово! Проверьте почту и подтвердите аккаунт.'}
async function login(){const {error}=await sb.auth.signInWithPassword({email:document.getElementById('email').value,password:document.getElementById('pass').value});if(error)document.getElementById('authmsg').textContent=error.message;else{closeModal();refresh()}}
async function sendRequest(id){if(!me)return openAuth();const {error}=await sb.from('friend_requests').insert({sender_id:me.id,receiver_id:id});alert(error?error.message:'Заявка отправлена')}
function openCreate(){if(!me)return openAuth();openModal(`<h2>Моя анкета</h2><input id=dn placeholder="Отображаемое имя"><input id=city placeholder="Город" style="margin-top:8px"><input id=interests placeholder="Интересы через запятую" style="margin-top:8px"><textarea id=bio placeholder="Расскажи о себе" style="margin-top:8px"></textarea><button class="btn primary" style="margin-top:10px" onclick="saveProfile()">Сохранить</button>`)}
async function saveProfile(){const patch={display_name:dn.value,city:city.value,bio:bio.value,interests:interests.value.split(',').map(x=>x.trim()).filter(Boolean)};const {error}=await sb.from('profiles').update(patch).eq('id',me.id);alert(error?error.message:'Сохранено');if(!error){closeModal();refresh()}}
async function openProfile(){if(!me)return openAuth();const {data:p}=await sb.from('profiles').select('*').eq('id',me.id).single();openModal(`<h2>${esc(p.display_name||p.username)} ${p.verified?'✓':''}</h2><p class=muted>${esc(me.email)}</p><button class="btn" onclick="openCreate()">Редактировать анкету</button><button class=btn onclick="logout()">Выйти</button>${['admin','owner'].includes(p.role)?'<button class="btn primary" onclick="adminPanel()">Админ-панель</button>':''}`)}
async function logout(){await sb.auth.signOut();closeModal();refresh()}
async function adminPanel(){const {data:{session}}=await sb.auth.getSession();const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:'{}'});const d=await r.json();if(!r.ok)return alert(d.error);openModal('<h2>Админ-панель</h2><div>'+d.users.map(u=>`<div class=card style="margin:8px 0"><b>${esc(u.username)}</b> ${u.verified?'✓':''}<div class=muted>${esc(u.email)} · ${u.role}</div><button class=btn onclick="adminUpdate('${u.id}',${!u.verified},${u.banned})">${u.verified?'Снять':'Выдать'} галочку</button><button class=btn onclick="adminUpdate('${u.id}',${u.verified},${!u.banned})">${u.banned?'Разбанить':'Забанить'}</button></div>`).join('')+'</div>')}
async function adminUpdate(id,verified,banned){const {data:{session}}=await sb.auth.getSession();const r=await fetch('/api/admin',{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:JSON.stringify({action:'update_user',target_id:id,verified,banned})});const d=await r.json();if(!r.ok)alert(d.error);else adminPanel()}
function showHome(){closeModal();scrollTo({top:0,behavior:'smooth'})}
initSupabase().then(refresh);
</script></body></html>
